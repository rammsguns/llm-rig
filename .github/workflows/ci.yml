name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref; these are cheap checks and there is no
# value in finishing a run for a commit that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: syntax, shellcheck, fixture tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version

      - name: Show environment
        run: |
          bash --version | head -1
          # The suite must pass with no GPU present. Prove there isn't one, so a
          # future runner image that happens to ship nvidia-smi can't mask a
          # test that accidentally depends on real hardware.
          if command -v nvidia-smi >/dev/null 2>&1; then
            echo "::warning::nvidia-smi present on runner; tests must still use mocks"
          else
            echo "no nvidia-smi on runner, as expected"
          fi

      - name: Run tests
        run: ./tests/run.sh

      - name: Assert the suite needs no network
        # Re-run with no route out, so anything that quietly reached the
        # internet fails here rather than becoming a flaky test months later.
        #
        # No sudo: `unshare --map-root-user` creates an unprivileged user
        # namespace, and combining it with real root breaks exec inside the
        # namespace (exit 126). If the runner forbids unprivileged user
        # namespaces entirely, warn rather than fail -- that is a runner
        # limitation, not a defect in the code under test.
        run: |
          if ! unshare --net --map-root-user true 2>/dev/null; then
            echo "::warning::unprivileged user namespaces unavailable; skipping no-network check"
            exit 0
          fi
          unshare --net --map-root-user bash -c '
            ip link set lo up 2>/dev/null || true
            exec bash ./tests/run.sh --no-lint
          '
